spring.application.name=auth-service

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=saas
spring.datasource.password=saas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=THIS_IS_A_SECRET_KEY_FOR_AUTH_SERVICE_CHANGE_IT_LATER_123456789
jwt.expiration=86400000