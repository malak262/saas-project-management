services:
  #################################################
  # React Frontend
  #################################################

  frontend:
    build:
      context: ./frontend
    container_name: saas-frontend
    restart: unless-stopped

    command: npm run dev -- --host

    ports:
      - "${FRONTEND_PORT}:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    stdin_open: true
    tty: true

    depends_on:
      - workspace-nginx

    networks:
      - saas-network

  #################################################
  # Workspace Service (Symfony API Platform)
  #################################################

  workspace-php:
    build:
      context: ./services/workspace-service

    container_name: workspace-php

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - ./services/workspace-service:/var/www/html
      - workspace_vendor:/var/www/html/vendor

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}

      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@workspace-db:3306/${WORKSPACE_DATABASE}?serverVersion=8.0&charset=utf8mb4"

    depends_on:
      workspace-db:
        condition: service_healthy

    networks:
      - saas-network

  #################################################
  # Nginx
  #################################################

  workspace-nginx:
    image: nginx:1.27-alpine

    container_name: workspace-nginx

    restart: unless-stopped

    ports:
      - "${WORKSPACE_PORT}:80"

    volumes:
      - ./services/workspace-service:/var/www/html
      - ./services/workspace-service/docker/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - workspace-php

    networks:
      - saas-network

  #################################################
  # MySQL Workspace
  #################################################

  workspace-db:
    image: mysql:8.0

    container_name: workspace-db

    restart: unless-stopped

    command: --default-authentication-plugin=mysql_native_password

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORKSPACE_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "${WORKSPACE_DB_PORT}:3306"

    volumes:
      - workspace_db_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - saas-network

#################################################
# Volumes
#################################################

volumes:
  workspace_db_data:
  workspace_vendor:

#################################################
# Network
#################################################

networks:
  saas-network:
    driver: bridge