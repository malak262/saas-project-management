name: teamflow
x-backend: &backend
  JWT_SECRET: ${JWT_SECRET:?Run scripts/setup.ps1 first}
  SERVICE_SECRET: ${SERVICE_SECRET:?Run scripts/setup.ps1 first}
  DB_USER: teamflow
  DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1 first}
  USER_URL: http://user-service:8080
  WORKSPACE_URL: http://workspace-service:8000
  PROJECT_URL: http://project-service:8080
  NOTIFICATION_URL: http://notification-service:8080
x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  healthcheck:
    test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
    interval: 5s
    timeout: 5s
    retries: 30
  environment: &mysql-env
    MYSQL_DATABASE: teamflow
    MYSQL_USER: teamflow
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
services:
  nginx:
    image: nginx:alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./gateway/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on: [auth-service, user-service, workspace-service, project-service, task-service, notification-service, frontend]
    restart: unless-stopped
  auth-service:
    build: {context: ./services, dockerfile: auth-service/Dockerfile}
    environment:
      <<: *backend
      DATABASE_URL: jdbc:mysql://auth-db:3306/teamflow
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TEAMFLOW_ADMIN_EMAIL: ${TEAMFLOW_ADMIN_EMAIL:-}
      TEAMFLOW_ADMIN_PASSWORD: ${TEAMFLOW_ADMIN_PASSWORD:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      auth-db: {condition: service_healthy}
      user-service: {condition: service_started}
    restart: unless-stopped
  user-service:
    build: {context: ./services, dockerfile: user-service/Dockerfile}
    environment:
      <<: *backend
      CONNECTION_STRING: Server=user-db;Database=teamflow;User ID=teamflow;Password=${DB_PASSWORD}
    depends_on:
      user-db: {condition: service_healthy}
    restart: unless-stopped
  workspace-service:
    build: {context: ./services, dockerfile: workspace-service/Dockerfile}
    environment: &workspace-env
      <<: *backend
      DATABASE_DSN: mysql:host=workspace-db;dbname=teamflow;charset=utf8mb4
    depends_on:
      workspace-db: {condition: service_healthy}
    restart: unless-stopped
  workspace-worker:
    build: {context: ./services, dockerfile: workspace-service/Dockerfile}
    command: [sh, -c, 'php bin/init.php && php bin/worker.php']
    environment: *workspace-env
    depends_on:
      workspace-db: {condition: service_healthy}
      notification-service: {condition: service_started}
    restart: unless-stopped
  project-service:
    build: {context: ./services, dockerfile: project-service/Dockerfile}
    environment:
      <<: *backend
      DATABASE_URL: jdbc:mysql://project-db:3306/teamflow
    depends_on:
      project-db: {condition: service_healthy}
    restart: unless-stopped
  task-service:
    build: {context: ./services, dockerfile: task-service/Dockerfile}
    environment: &task-env
      <<: *backend
      DATABASE_DSN: mysql:host=task-db;dbname=teamflow;charset=utf8mb4
    depends_on:
      task-db: {condition: service_healthy}
    restart: unless-stopped
  task-worker:
    build: {context: ./services, dockerfile: task-service/Dockerfile}
    command: [sh, -c, 'php bin/init.php && php bin/worker.php']
    environment: *task-env
    depends_on:
      task-db: {condition: service_healthy}
      notification-service: {condition: service_started}
    restart: unless-stopped
  notification-service:
    build: {context: ./services, dockerfile: notification-service/Dockerfile}
    environment:
      <<: *backend
      CONNECTION_STRING: Server=notification-db;Database=teamflow;User ID=teamflow;Password=${DB_PASSWORD}
    depends_on:
      notification-db: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  auth-db:
    <<: *mysql
    volumes: [auth_data:/var/lib/mysql]
  user-db:
    <<: *mysql
    volumes: [user_data:/var/lib/mysql]
  workspace-db:
    <<: *mysql
    volumes: [workspace_data:/var/lib/mysql]
  project-db:
    <<: *mysql
    volumes: [project_data:/var/lib/mysql]
  task-db:
    <<: *mysql
    volumes: [task_data:/var/lib/mysql]
  notification-db:
    <<: *mysql
    volumes: [notification_data:/var/lib/mysql]
volumes:
  auth_data:
  user_data:
  workspace_data:
  project_data:
  task_data:
  notification_data:
