worker_processes auto;
events { worker_connections 1024; }
http {
 resolver 127.0.0.11 valid=10s ipv6=off;
 include /etc/nginx/mime.types;
 server_tokens off;
 gzip on;
 gzip_types application/json application/javascript text/css;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
 server {
  set $auth_backend auth-service:8080;
  set $user_backend user-service:8080;
  set $workspace_backend workspace-service:8000;
  set $project_backend project-service:8080;
  set $task_backend task-service:8000;
  set $notification_backend notification-service:8080;
  set $frontend_backend frontend:80;
  listen 80;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_intercept_errors on;
  error_page 502 503 504 = @unavailable;
  error_page 429 = @rate_limited;
  error_page 413 = @too_large;
  location @rate_limited { default_type application/json; return 429 '{"error":{"status":429,"message":"Too many attempts. Please wait a minute and try again."}}'; }
  location @too_large { default_type application/json; return 413 '{"error":{"status":413,"message":"The request is too large."}}'; }
  location @unavailable { default_type application/json; return 503 '{"error":{"status":503,"message":"Teamflow is starting or a service is temporarily unavailable. Please try again shortly."}}'; }
  location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
  location ~ ^/api/auth/(login|register|exchange)$ { limit_req zone=auth burst=10 nodelay; limit_req_status 429; proxy_pass http://$auth_backend; }
  location /api/auth/ { proxy_pass http://$auth_backend; }
  location ~ ^/api/users(?:/|$) { proxy_pass http://$user_backend; }
  location ~ ^/api/(workspaces|invitations)(?:/|$) { proxy_pass http://$workspace_backend; }
  location ~ ^/api/projects(?:/|$) { proxy_pass http://$project_backend; }
  location ~ ^/api/tasks(?:/|$) { proxy_pass http://$task_backend; }
  location ~ ^/api/notifications(?:/|$) { proxy_pass http://$notification_backend; }
  location /api/ { default_type application/json; return 404 '{"error":{"status":404,"message":"This endpoint does not exist."}}'; }
  location /internal { default_type application/json; return 404 '{"error":{"status":404,"message":"This endpoint does not exist."}}'; }
  location / { proxy_pass http://$frontend_backend; }
 }
}
