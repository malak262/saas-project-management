events {}

http {
    server {
        listen 80;

        # =========================
        # CORS GLOBAL
        # =========================

        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # =========================
        # AUTH SERVICE
        # =========================

        location /api/auth/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://auth-service:8080/api/auth/;
        }

        # =========================
        # USER SERVICE
        # =========================

        location /api/users/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://user-service:8080/api/users/;
        }

        # =========================
        # WORKSPACE SERVICE
        # =========================

        location = /api/workspaces {

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Empêcher le header CORS du service interne
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://workspace-nginx/api/workspaces;
        }

        location /api/workspaces/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            proxy_pass http://workspace-nginx/api/workspaces/;
        }

        # =========================
        # PROJECT SERVICE
        # =========================

        location = /api/projects {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://project-service:8080/api/projects;
        }

        location /api/projects/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://project-service:8080/api/projects/;
        }

        # =========================
        # TASK SERVICE
        # =========================

        location /api/tasks/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://task-service:8000/api/tasks/;
        }

        # =========================
        # NOTIFICATION SERVICE
        # =========================

        location /api/notifications/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://notification-service:8080/api/notifications/;
        }
    }
}
